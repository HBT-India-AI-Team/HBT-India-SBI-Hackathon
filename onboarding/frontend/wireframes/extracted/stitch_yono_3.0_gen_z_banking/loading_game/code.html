<style>
        .loading-pulse {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        .loading-spin {
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full flex flex-col font-body-md overflow-hidden">
<!-- Top AppBar (Simplified for loading state) -->
<header class="w-full top-0 sticky flex items-center justify-between px-container-margin py-md z-10 bg-surface">
<button aria-label="Go back" class="flex items-center justify-center p-xs rounded-full hover:bg-surface-container-low active:scale-95 transition-transform text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline-sm text-headline-sm text-primary">YONO 3.0</div>
<div class="w-8"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin pb-xl relative">
<!-- Subtle Background Decoration -->
<div class="absolute inset-0 z-0 flex items-center justify-center opacity-10 pointer-events-none">
<div class="w-64 h-64 rounded-full bg-primary-container blur-3xl"></div>
</div>
<div class="z-10 flex flex-col items-center">
<!-- Loading Animation Container -->
<div class="relative w-32 h-32 mb-lg flex items-center justify-center">
<!-- Outer Pulse Ring -->
<div class="absolute inset-0 rounded-full border-4 border-primary-container loading-pulse"></div>
<!-- Inner Spinner -->
<svg class="w-20 h-20 text-primary loading-spin" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<!-- Center Icon -->
<span class="material-symbols-outlined absolute text-primary" data-icon="sports_esports" style="font-size: 2rem; font-variation-settings: 'FILL' 1;">sports_esports</span>
</div>
<!-- Loading Text -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs animate-pulse text-center">Loading your game...</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[280px]">Preparing your financial adventure</p>
</div>
</main>
<!-- Navigation suppressed for linear/transactional loading state -->
</body></html>
