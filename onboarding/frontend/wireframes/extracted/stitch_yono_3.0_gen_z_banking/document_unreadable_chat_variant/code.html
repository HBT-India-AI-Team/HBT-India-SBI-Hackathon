<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>SBI YONO 3.0 - YONO Assistant</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config injected from system prompt -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#a5c8ff",
                        "primary-fixed-dim": "#a5c8ff",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#626567",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "surface-container": "#ededf3",
                        "on-primary-fixed-variant": "#0d4782",
                        "surface-dim": "#d9dadf",
                        "surface-container-high": "#e8e8ed",
                        "on-tertiary-container": "#ffae6b",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "primary": "#00386b",
                        "surface": "#f9f9ff",
                        "tertiary-fixed": "#ffdcc3",
                        "background": "#f9f9ff",
                        "inverse-on-surface": "#f0f0f6",
                        "outline-variant": "#c2c6d1",
                        "surface-tint": "#2f5f9b",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#191c1e",
                        "secondary-fixed-dim": "#c4c7ca",
                        "on-error-container": "#93000a",
                        "on-surface": "#1a1c20",
                        "secondary-fixed": "#e0e3e6",
                        "tertiary": "#582c00",
                        "surface-container-low": "#f3f3f9",
                        "surface-bright": "#f9f9ff",
                        "secondary": "#5b5f61",
                        "primary-fixed": "#d4e3ff",
                        "surface-variant": "#e2e2e8",
                        "error-container": "#ffdad6",
                        "secondary-container": "#e0e3e6",
                        "outline": "#737781",
                        "on-secondary-fixed-variant": "#44474a",
                        "surface-container-highest": "#e2e2e8",
                        "on-tertiary-fixed": "#2f1500",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#001c3a",
                        "tertiary-container": "#793f00",
                        "tertiary-fixed-dim": "#ffb77e",
                        "primary-container": "#1a4f8a",
                        "on-surface-variant": "#424750",
                        "inverse-surface": "#2e3035",
                        "on-background": "#1a1c20",
                        "on-primary-container": "#9ac2ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "md": "16px",
                        "xs": "8px",
                        "sm": "12px",
                        "container-margin": "20px",
                        "base": "4px",
                        "xl": "32px",
                        "card-gap": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Quicksand"],
                        "headline-sm": ["Quicksand"],
                        "display-lg": ["Quicksand"],
                        "label-md": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "label-sm": ["Quicksand"],
                        "headline-lg-mobile": ["Quicksand"],
                        "body-md": ["Quicksand"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Base styles matching the modern-tactile approach */
        body {
            background-color: #f5f7fa; /* The surface background */
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .safe-area-pt { padding-top: env(safe-area-inset-top); }
        .safe-area-pb { padding-bottom: env(safe-area-inset-bottom); }
        
        /* Level 1 Card Shadow */
        .shadow-level-1 {
            box-shadow: 0px 4px 20px rgba(26, 79, 138, 0.05);
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim w-full top-0 sticky z-40 safe-area-pt">
<div class="flex items-center justify-between px-container-margin h-14 w-full">
<button aria-label="Go back" class="flex items-center justify-center p-2 -ml-2 text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-weight="regular" style="font-size: 24px;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-primary dark:text-primary-fixed-dim font-bold tracking-tight mx-auto pr-8">
                YONO Assistant
            </h1>
</div>
</header>
<!-- Progress Stepper -->
<div class="w-full px-container-margin py-md bg-surface border-b border-surface-variant z-30 sticky top-[56px] shadow-sm">
<div class="flex items-center justify-between max-w-md mx-auto relative">
<!-- Connecting Line -->
<div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-full h-[2px] bg-surface-variant z-0"></div>
<!-- Active Connecting Line (Progress) -->
<div class="absolute left-0 top-1/2 transform -translate-y-1/2 w-[66%] h-[2px] bg-primary-container z-0 transition-all duration-500"></div>
<!-- Step 1 -->
<div class="flex flex-col items-center relative z-10 gap-base w-16">
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-sm text-label-sm shadow-level-1">
<span class="material-symbols-outlined" style="font-size: 14px;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center leading-tight">Details</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center relative z-10 gap-base w-16">
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-sm text-label-sm shadow-level-1">
<span class="material-symbols-outlined" style="font-size: 14px;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center leading-tight">Docs</span>
</div>
<!-- Step 3 (Active) -->
<div class="flex flex-col items-center relative z-10 gap-base w-16">
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-sm text-label-sm shadow-level-1 ring-2 ring-offset-2 ring-primary-container ring-offset-surface">
                    3
                </div>
<span class="font-label-sm text-label-sm text-primary font-bold text-center leading-tight">Identity</span>
</div>
<!-- Step 4 -->
<div class="flex flex-col items-center relative z-10 gap-base w-16">
<div class="w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-sm text-label-sm border border-outline-variant">
                    4
                </div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center leading-tight opacity-50">Review</span>
</div>
</div>
</div>
<!-- Chat Canvas -->
<main class="flex-1 overflow-y-auto px-container-margin py-lg flex flex-col gap-lg pb-[100px]">
<!-- System Message -->
<div class="flex justify-center w-full">
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container-high px-3 py-1 rounded-full">
                Today, 10:42 AM
            </span>
</div>
<!-- Bot Chat Bubble -->
<div class="flex flex-col gap-sm max-w-[85%] self-start animate-fade-in-up">
<div class="flex items-end gap-sm">
<!-- Avatar -->
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center flex-shrink-0 shadow-sm">
<span class="material-symbols-outlined" style="font-size: 18px;">smart_toy</span>
</div>
<!-- Bubble -->
<div class="bg-surface-container-lowest text-on-surface p-md rounded-2xl rounded-bl-sm shadow-level-1 border border-outline-variant/10">
<p class="font-body-md text-body-md">
                        That photo's a bit blurry — mind retaking it? We need a clear view of your face for identity verification.
                    </p>
</div>
</div>
<!-- Action Area Below Bubble -->
<div class="pl-11 pr-4">
<button class="w-full h-[56px] bg-primary-container text-on-primary-container rounded-xl font-label-md text-label-md shadow-level-1 hover:shadow-md active:scale-95 transition-all flex items-center justify-center gap-xs">
<span class="material-symbols-outlined">photo_camera</span>
                    Retake photo
                </button>
</div>
</div>
<!-- User Chat Bubble (Previous action simulation) -->
<div class="flex flex-col gap-xs max-w-[85%] self-end mt-4 opacity-50">
<div class="bg-primary-container text-on-primary-container p-md rounded-2xl rounded-br-sm shadow-sm ml-auto">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined">image</span>
<span class="font-body-md text-body-md">selfie_upload.jpg</span>
</div>
</div>
</div>
</main>
<!-- Bottom Input Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-md border-t border-outline-variant/30 z-50 safe-area-pb shadow-[0px_-4px_20px_rgba(26,79,138,0.05)]">
<div class="flex items-center px-container-margin py-sm gap-sm h-auto min-h-[72px]">
<!-- Attachment Button -->
<button aria-label="Attach file" class="p-2 text-primary hover:bg-surface-container-high rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined">attach_file</span>
</button>
<!-- Input Field -->
<div class="flex-1 bg-surface-container-low rounded-xl border border-outline-variant/50 focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all flex items-center px-4 py-3">
<input class="w-full bg-transparent border-none outline-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70 p-0 m-0 focus:ring-0" disabled="" placeholder="Type a message..." type="text"/>
</div>
<!-- Microphone/Send Button -->
<button aria-label="Voice input" class="w-12 h-12 rounded-full bg-surface-container-high text-primary flex items-center justify-center hover:bg-surface-container transition-colors active:scale-90 flex-shrink-0">
<span class="material-symbols-outlined" data-weight="fill">mic</span>
</button>
</div>
</div>
<!-- Minimal Animation Styles -->
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
</body></html>
