<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>YONO 3.0 - Onboarding Chat</title>

<style>
        /* Custom Utilities */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        
        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        @keyframes pulseSoft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-soft { animation: pulseSoft 2s infinite; }

        /* Custom Input Autofill style removal */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px theme('colors.surface-container-lowest') inset !important;
            -webkit-text-fill-color: theme('colors.on-surface') !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md h-[100dvh] flex flex-col antialiased pt-safe overflow-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface flex items-center justify-between px-container-margin h-14 z-50 shrink-0">
<button class="text-primary active:scale-95 transition-transform p-2 -ml-2 rounded-full hover:bg-surface-container-high focus:outline-none focus:bg-surface-container-high">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 400;">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-primary font-bold">Open Account</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Persistent Progress Stepper -->
<div class="bg-surface/90 backdrop-blur-md sticky top-0 z-40 px-container-margin py-sm shrink-0 shadow-[0px_4px_20px_rgba(26,79,138,0.02)] border-b border-surface-variant/50">
<div class="max-w-md mx-auto">
<div class="flex items-center justify-between relative">
<!-- Progress Line Track -->
<div class="absolute left-4 right-4 top-1/2 -translate-y-1/2 h-[3px] bg-surface-variant rounded-full z-0"></div>
<!-- Progress Line Fill -->
<div class="absolute left-4 w-[60%] top-1/2 -translate-y-1/2 h-[3px] bg-primary rounded-full z-0 transition-all duration-700 ease-in-out"></div>
<!-- Step 1: Done -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined" style="font-size: 14px; font-variation-settings: 'wght' 600;">check</span>
</div>
</div>
<!-- Step 2: Done -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined" style="font-size: 14px; font-variation-settings: 'wght' 600;">check</span>
</div>
</div>
<!-- Step 3: Active -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-7 h-7 rounded-full bg-primary-container text-on-primary-container ring-2 ring-primary ring-offset-2 ring-offset-surface flex items-center justify-center font-label-sm text-label-sm shadow-sm scale-110 transition-transform">
                        3
                    </div>
</div>
<!-- Step 4: Pending -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-7 h-7 rounded-full bg-surface-container-highest text-on-surface-variant flex items-center justify-center font-label-sm text-label-sm">
                        4
                    </div>
</div>
</div>
<div class="text-center mt-sm">
<span class="font-label-md text-label-md text-primary tracking-wide">Confirm Identity</span>
</div>
</div>
</div>
<!-- Chat Canvas -->
<main class="flex-1 overflow-y-auto px-container-margin py-lg flex flex-col gap-lg bg-background pb-safe relative" id="chat-container">
<!-- Subtle Ambient Background Pattern -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(theme(colors.primary) 1px, transparent 1px); background-size: 24px 24px;"></div>
<!-- Chat Thread Content -->
<div class="max-w-md w-full mx-auto flex flex-col gap-lg pb-10">
<!-- Date Separator -->
<div class="flex justify-center my-2 opacity-0 animate-fade-in-up" style="animation-delay: 0.1s;">
<span class="bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm px-3 py-1 rounded-full border border-surface-variant">Today</span>
</div>
<!-- System Message Bubble -->
<div class="flex gap-xs items-end max-w-[90%] opacity-0 animate-fade-in-up" style="animation-delay: 0.2s;">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center shrink-0 border border-outline-variant/30 mb-5">
<span class="material-symbols-outlined text-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
</div>
<div class="flex flex-col gap-1">
<div class="bg-surface-container-lowest border border-surface-variant/40 text-on-surface rounded-2xl rounded-bl-sm p-4 shadow-[0px_2px_8px_rgba(26,79,138,0.04)] relative">
<p class="font-body-md text-body-md leading-relaxed">Let's verify your business entity. Please provide your business details below to proceed.</p>
</div>
<span class="font-label-sm text-[10px] text-secondary ml-1">YONO Assistant • 10:42 AM</span>
</div>
</div>
<!-- Embedded Form Card (Within Chat Flow) -->
<div class="ml-10 w-[calc(100%-40px)] bg-surface-container-lowest rounded-2xl p-5 shadow-[0px_8px_24px_rgba(26,79,138,0.06)] border border-outline-variant/20 flex flex-col gap-md relative z-10 opacity-0 animate-fade-in-up" style="animation-delay: 0.4s;">
<div class="flex items-center gap-2 border-b border-surface-variant/50 pb-3 mb-1">
<span class="material-symbols-outlined text-primary-container bg-primary/10 p-1.5 rounded-lg" style="font-variation-settings: 'FILL' 1;">storefront</span>
<h2 class="font-headline-sm text-[18px] text-on-background font-semibold">Business Details</h2>
</div>
<!-- Floating Label Input: GSTIN -->
<div class="relative group mt-2">
<input autocomplete="off" class="peer w-full h-[56px] bg-surface border border-outline-variant/40 rounded-xl px-4 pt-5 pb-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all placeholder-transparent uppercase tracking-wide" id="gstinInput" placeholder="GSTIN" type="text"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 font-body-md text-body-md text-on-surface-variant transition-all duration-200 peer-focus:top-3 peer-focus:text-[11px] peer-focus:text-primary peer-focus:-translate-y-0 peer-[:not(:placeholder-shown)]:top-3 peer-[:not(:placeholder-shown)]:text-[11px] peer-[:not(:placeholder-shown)]:-translate-y-0 pointer-events-none" for="gstinInput">
                        GSTIN <span class="text-error">*</span>
</label>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-primary opacity-0 transition-opacity" id="gstinCheck">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Read-only/Auto-fill Input: Business Name -->
<div class="relative group mt-1">
<input class="peer w-full h-[56px] bg-surface-container-low/50 border border-outline-variant/20 rounded-xl px-4 pt-5 pb-2 font-body-md text-body-md text-on-surface-variant focus:outline-none transition-all placeholder-transparent cursor-default" id="businessNameInput" placeholder="Business Name" readonly="" type="text" value=""/>
<label class="absolute left-4 top-[12px] text-[11px] font-body-md text-on-surface-variant pointer-events-none transition-all" for="businessNameInput">
                        Business Name
                    </label>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[18px] animate-pulse-soft hidden" id="businessSpinner">sync</span>
<span class="material-symbols-outlined text-[18px]" id="businessLock">lock</span>
</div>
</div>
<!-- Dropdown Selector: Authorized Signatory -->
<div class="relative group mt-1">
<select class="peer w-full h-[56px] bg-surface border border-outline-variant/40 rounded-xl px-4 pt-5 pb-2 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all appearance-none cursor-not-allowed opacity-60 disabled:bg-surface-container-low/50" disabled="" id="signatorySelect">
<option disabled="" selected="" value=""></option>
<option value="1">Rajesh Kumar (Director)</option>
<option value="2">Priya Sharma (Partner)</option>
</select>
<label class="absolute left-4 top-[12px] text-[11px] font-body-md text-on-surface-variant pointer-events-none transition-all" for="signatorySelect">
                        Authorized Signatory <span class="text-error">*</span>
</label>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
<!-- Action Button (Disabled initially) -->
<button class="w-full h-[52px] mt-2 bg-surface-container-high text-on-surface-variant/50 rounded-full font-label-md text-label-md flex items-center justify-center gap-xs cursor-not-allowed transition-all duration-300 shadow-none border border-transparent" disabled="" id="continueBtn">
                    Continue
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Bottom spacer to ensure scrolling past the card -->
<div class="h-10"></div>
</div>
</main>
<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const gstinInput = document.getElementById('gstinInput');
            const businessNameInput = document.getElementById('businessNameInput');
            const signatorySelect = document.getElementById('signatorySelect');
            const continueBtn = document.getElementById('continueBtn');
            const gstinCheck = document.getElementById('gstinCheck');
            const businessSpinner = document.getElementById('businessSpinner');
            const businessLock = document.getElementById('businessLock');
            const chatContainer = document.getElementById('chat-container');

            let typingTimer;
            const doneTypingInterval = 800; // ms

            gstinInput.addEventListener('input', () => {
                clearTimeout(typingTimer);
                
                // Reset states
                businessNameInput.value = '';
                signatorySelect.disabled = true;
                signatorySelect.classList.add('cursor-not-allowed', 'opacity-60', 'bg-surface-container-low/50');
                signatorySelect.classList.remove('cursor-pointer', 'opacity-100', 'bg-surface');
                signatorySelect.selectedIndex = 0;
                
                disableContinueButton();
                gstinCheck.classList.remove('opacity-100');
                businessLock.classList.remove('hidden');
                businessSpinner.classList.add('hidden');

                if (gstinInput.value.length > 5) {
                    businessLock.classList.add('hidden');
                    businessSpinner.classList.remove('hidden');
                    
                    typingTimer = setTimeout(() => {
                        simulateApiCall();
                    }, doneTypingInterval);
                }
            });

            function simulateApiCall() {
                // Simulate network delay
                setTimeout(() => {
                    if (gstinInput.value.length > 5) {
                        // Success State
                        businessSpinner.classList.add('hidden');
                        businessLock.classList.remove('hidden');
                        businessLock.textContent = 'verified';
                        businessLock.classList.replace('text-outline-variant', 'text-primary');
                        
                        businessNameInput.value = 'Apex Retail Solutions Pvt Ltd';
                        gstinCheck.classList.add('opacity-100');
                        
                        // Enable Dropdown
                        signatorySelect.disabled = false;
                        signatorySelect.classList.remove('cursor-not-allowed', 'opacity-60', 'bg-surface-container-low/50');
                        signatorySelect.classList.add('cursor-pointer', 'opacity-100', 'bg-surface');
                        
                        // Scroll slightly to bring dropdown into full view
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    }
                }, 1000);
            }

            signatorySelect.addEventListener('change', () => {
                if (signatorySelect.value) {
                    enableContinueButton();
                } else {
                    disableContinueButton();
                }
            });

            function enableContinueButton() {
                continueBtn.disabled = false;
                continueBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant/50', 'cursor-not-allowed');
                continueBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-md', 'hover:bg-primary-fixed-variant', 'active:scale-[0.98]');
                
                // Ensure span inside button inherits color correctly in active state
                continueBtn.querySelector('span').classList.remove('text-on-surface-variant/50');
            }

            function disableContinueButton() {
                continueBtn.disabled = true;
                continueBtn.classList.add('bg-surface-container-high', 'text-on-surface-variant/50', 'cursor-not-allowed');
                continueBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-md', 'hover:bg-primary-fixed-variant', 'active:scale-[0.98]');
            }
        });
    </script>
</body></html>
