<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding Success - YONO 3.0</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "inverse-on-surface": "#f0f0f6",
                        "primary": "#00386b",
                        "on-tertiary-container": "#ffae6b",
                        "on-primary-fixed-variant": "#0d4782",
                        "surface-dim": "#d9dadf",
                        "on-surface": "#1a1c20",
                        "inverse-primary": "#a5c8ff",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary-fixed": "#2f1500",
                        "secondary-container": "#e0e3e6",
                        "secondary-fixed": "#e0e3e6",
                        "tertiary": "#582c00",
                        "inverse-surface": "#2e3035",
                        "surface-container-low": "#f3f3f9",
                        "secondary-fixed-dim": "#c4c7ca",
                        "surface-container-highest": "#e2e2e8",
                        "outline-variant": "#c2c6d1",
                        "on-secondary-fixed-variant": "#44474a",
                        "on-primary-fixed": "#001c3a",
                        "secondary": "#5b5f61",
                        "error-container": "#ffdad6",
                        "on-background": "#1a1c20",
                        "on-error": "#ffffff",
                        "surface-container": "#ededf3",
                        "on-surface-variant": "#424750",
                        "on-secondary-container": "#626567",
                        "surface-container-high": "#e8e8ed",
                        "surface-variant": "#e2e2e8",
                        "surface-tint": "#2f5f9b",
                        "surface": "#f9f9ff",
                        "error": "#ba1a1a",
                        "primary-fixed": "#d4e3ff",
                        "outline": "#737781",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdcc3",
                        "on-secondary-fixed": "#191c1e",
                        "primary-fixed-dim": "#a5c8ff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#9ac2ff",
                        "on-error-container": "#93000a",
                        "background": "#f9f9ff",
                        "tertiary-fixed-dim": "#ffb77e",
                        "primary-container": "#1a4f8a",
                        "tertiary-container": "#793f00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "sm": "12px",
                        "card-gap": "16px",
                        "xl": "32px",
                        "lg": "24px",
                        "container-margin": "20px",
                        "md": "16px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "label-md": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "display-lg": ["Quicksand"],
                        "label-sm": ["Quicksand"],
                        "headline-sm": ["Quicksand"],
                        "headline-lg-mobile": ["Quicksand"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex flex-col font-body-md text-on-surface antialiased overflow-hidden relative">
<!-- Confetti Container -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin py-xl relative z-10">
<!-- Animated Badge -->
<div class="mb-lg relative animate-[bounce_2s_ease-in-out_infinite]">
<div class="w-32 h-32 rounded-full bg-primary-container flex items-center justify-center shadow-[0px_8px_30px_rgba(26,79,138,0.2)]">
<div class="w-24 h-24 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[64px]" style="font-variation-settings: 'FILL' 1;">
                        check_circle
                    </span>
</div>
</div>
<!-- Sparkles -->
<span class="material-symbols-outlined text-tertiary-fixed-dim absolute top-0 -left-4 text-3xl animate-pulse">arrow_back_ios_new</span>
<span class="material-symbols-outlined text-inverse-primary absolute bottom-4 -right-6 text-4xl animate-pulse delay-150">arrow_back_ios_new</span>
</div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary text-center mb-xl max-w-[300px]">
            You're officially an SBI customer! 🎉
        </h1>
<!-- Summary Card -->
<div class="bg-surface w-full max-w-sm rounded-xl p-container-margin shadow-[0px_4px_20px_rgba(26,79,138,0.05)] border border-outline-variant/20 mb-xl transform transition-transform hover:scale-[1.02]">
<div class="flex flex-col gap-md">
<!-- Account Type -->
<div class="flex justify-between items-center border-b border-surface-variant pb-sm">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">account_balance</span>
<span class="font-label-md text-label-md">Account Type</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Digital Savings</span>
</div>
<!-- Account Number -->
<div class="flex justify-between items-center">
<div class="flex items-center gap-xs text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">pin</span>
<span class="font-label-md text-label-md">Account Number</span>
</div>
<span class="font-body-md text-body-md text-on-surface tracking-wider">XXXX 8892</span>
</div>
</div>
</div>
</main>
<!-- Bottom Action -->
<div class="px-container-margin pb-xl pt-md bg-gradient-to-t from-surface-container-low to-transparent relative z-10 w-full max-w-md mx-auto">
<button class="w-full h-[56px] bg-primary text-on-primary font-label-md text-label-md rounded-full shadow-md active:scale-95 transition-transform flex items-center justify-center gap-xs hover:bg-primary-container hover:text-on-primary-container">
            Go to Home
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<script>
        // Simple confetti effect
        const container = document.getElementById('confetti-container');
        const colors = ['#00386b', '#1a4f8a', '#a5c8ff', '#ffae6b', '#582c00'];

        for (let i = 0; i < 50; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
            confetti.style.animationDelay = Math.random() * 2 + 's';
            // Randomize shape (circle or square)
            if(Math.random() > 0.5) {
                confetti.style.borderRadius = '50%';
            }
            container.appendChild(confetti);
        }
    </script>
</body></html>
