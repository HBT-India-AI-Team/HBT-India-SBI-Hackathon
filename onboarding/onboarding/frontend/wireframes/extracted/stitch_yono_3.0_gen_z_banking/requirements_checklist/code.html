<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>SBI YONO 3.0 - Requirements Checklist</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Quicksand -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration from Design System -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline-variant": "#c2c6d1",
                        "on-secondary-fixed": "#191c1e",
                        "tertiary-container": "#793f00",
                        "on-background": "#1a1c20",
                        "on-primary-container": "#9ac2ff",
                        "surface-tint": "#2f5f9b",
                        "secondary-fixed": "#e0e3e6",
                        "primary-container": "#1a4f8a",
                        "surface": "#f9f9ff",
                        "on-secondary-container": "#626567",
                        "surface-container-low": "#f3f3f9",
                        "on-error": "#ffffff",
                        "surface-container": "#ededf3",
                        "surface-dim": "#d9dadf",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#a5c8ff",
                        "on-primary": "#ffffff",
                        "tertiary": "#582c00",
                        "on-tertiary-fixed": "#2f1500",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "surface-container-high": "#e8e8ed",
                        "inverse-on-surface": "#f0f0f6",
                        "on-tertiary-container": "#ffae6b",
                        "on-primary-fixed": "#001c3a",
                        "surface-container-highest": "#e2e2e8",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#f9f9ff",
                        "primary": "#00386b",
                        "surface-variant": "#e2e2e8",
                        "outline": "#737781",
                        "primary-fixed": "#d4e3ff",
                        "tertiary-fixed": "#ffdcc3",
                        "error-container": "#ffdad6",
                        "inverse-surface": "#2e3035",
                        "on-error-container": "#93000a",
                        "secondary": "#5b5f61",
                        "on-primary-fixed-variant": "#0d4782",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#c4c7ca",
                        "primary-fixed-dim": "#a5c8ff",
                        "tertiary-fixed-dim": "#ffb77e",
                        "on-surface": "#1a1c20",
                        "on-surface-variant": "#424750",
                        "secondary-container": "#e0e3e6",
                        "background": "#f9f9ff",
                        "on-secondary-fixed-variant": "#44474a",
                        "error": "#ba1a1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "md": "16px",
                        "sm": "12px",
                        "base": "4px",
                        "xl": "32px",
                        "card-gap": "16px",
                        "xs": "8px",
                        "container-margin": "20px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "headline-sm": ["Quicksand"],
                        "headline-lg-mobile": ["Quicksand"],
                        "label-md": ["Quicksand"],
                        "label-sm": ["Quicksand"],
                        "body-lg": ["Quicksand"]
                    },
                    "fontSize": {
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],

                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Base styles */
        body {
            background-color: theme('colors.surface');
            color: theme('colors.on-surface');
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Hide scrollbar for clean chat view */
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* Custom animations for chat bubbles */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-bubble-anim {
            animation: slideUpFade 0.4s ease-out forwards;
        }
        
        /* Glassmorphism utility for bottom bar */
        .glass-panel {
            background: rgba(249, 249, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(194, 198, 209, 0.3);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface bg-background">
<!-- TopAppBar (Transactional - Hidden Navigation Shell, Only Back Action) -->
<header class="bg-surface sticky top-0 z-50 w-full">
<div class="flex items-center justify-between px-container-margin h-14 w-full">
<button aria-label="Go Back" class="text-primary active:scale-95 transition-transform flex items-center justify-center p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-primary font-bold">Open Account</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas (Chat Interface) -->
<main class="flex-1 overflow-y-auto px-container-margin pb-32 flex flex-col gap-lg mt-md">
<!-- Progress Stepper -->
<div class="flex items-center justify-center w-full px-4 py-2 chat-bubble-anim" style="animation-delay: 0.1s;">
<!-- Step 1: Complete -->
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-sm text-label-sm text-primary mt-1">Consent</span>
</div>
<div class="flex-1 h-[2px] bg-primary mx-2"></div>
<!-- Step 2: Complete -->
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-sm text-label-sm text-primary mt-1">Mobile</span>
</div>
<div class="flex-1 h-[2px] bg-primary mx-2"></div>
<!-- Step 3: Active -->
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center ring-2 ring-primary ring-offset-2 ring-offset-surface">
<span class="font-label-md text-label-md">3</span>
</div>
<span class="font-label-sm text-label-sm text-primary font-bold mt-1">Identity</span>
</div>
<div class="flex-1 h-[2px] bg-surface-variant mx-2"></div>
<!-- Step 4: Pending (Visual hint of more steps) -->
<div class="flex flex-col items-center opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center">
<span class="font-label-md text-label-md">4</span>
</div>
</div>
</div>
<!-- Chat Area -->
<div class="flex flex-col gap-md">
<!-- Bot Message -->
<div class="flex items-end gap-3 chat-bubble-anim" style="animation-delay: 0.2s; opacity: 0;">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-sm">robot_2</span>
</div>
<div class="bg-surface-container-low text-on-surface p-4 rounded-2xl rounded-bl-sm max-w-[85%] shadow-[0px_4px_20px_rgba(26,79,138,0.05)] border border-outline-variant/20">
<p class="font-body-md text-body-md">Great! Before we start document collection, here's what you'll need ready.</p>
</div>
</div>
<!-- Bot Requirements Card -->
<div class="flex items-end gap-3 chat-bubble-anim" style="animation-delay: 0.4s; opacity: 0;">
<div class="w-8 h-8 rounded-full bg-transparent flex-shrink-0"></div> <!-- Spacer aligned with avatar -->
<div class="bg-surface-container-lowest p-5 rounded-2xl rounded-bl-sm max-w-[90%] shadow-[0px_4px_20px_rgba(26,79,138,0.05)] border border-outline-variant/30 flex flex-col gap-4">
<div class="flex items-center gap-2 mb-2 border-b border-surface-variant pb-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">list_alt</span>
<h3 class="font-headline-sm text-headline-sm-mobile text-on-surface">What you'll need</h3>
</div>
<ul class="flex flex-col gap-4">
<li class="flex items-start gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed/30 flex items-center justify-center flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-primary-fixed-variant" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">PAN Card</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Original physical document</span>
</div>
</li>
<li class="flex items-start gap-3">
<div class="w-10 h-10 rounded-full bg-primary-fixed/30 flex items-center justify-center flex-shrink-0 mt-1">
<span class="material-symbols-outlined text-primary-fixed-variant" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">GST Certificate</span>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px] text-tertiary-container">info</span>
                                    Only if applicable to your business
                                </span>
</div>
</li>
</ul>
<button class="mt-4 w-full h-[56px] bg-primary text-on-primary rounded-full font-label-md text-label-md flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-md">
                        Got it, let's start
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<!-- Bottom Input Bar (Chat context) -->
<div class="fixed bottom-0 w-full z-40 glass-panel px-4 py-3 pb-safe shadow-[0px_-4px_20px_rgba(26,79,138,0.05)]">
<div class="flex items-center gap-3">
<button class="w-10 h-10 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center flex-shrink-0 hover:text-primary transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
<div class="flex-1 bg-surface-container-lowest border border-outline-variant/50 rounded-full px-4 py-3 flex items-center">
<input class="bg-transparent border-none outline-none w-full font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:ring-0 p-0" disabled="" placeholder="Type a message..." type="text"/>
</div>
<button class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center flex-shrink-0 opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</div>
</body></html>
