<!DOCTYPE html>

<style>
        body { font-family: 'Quicksand', sans-serif; }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex flex-col text-on-surface">
<!-- TopAppBar -->
<header class="w-full top-0 sticky shadow-sm bg-surface dark:bg-inverse-surface shadow-[0px_4px_20px_rgba(26,79,138,0.05)] z-40">
<div class="flex items-center justify-between px-container-margin py-md">
<div class="flex items-center gap-xs">
<button class="p-xs rounded-full hover:bg-surface-container-low active:scale-95 transition-transform text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Application Status</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin py-xl pb-32">
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-[0px_4px_20px_rgba(26,79,138,0.05)] flex flex-col items-center text-center max-w-sm w-full mx-auto relative overflow-hidden">
<!-- Subtle Background Accents -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-fixed opacity-30 rounded-bl-full -mr-16 -mt-16 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-24 h-24 bg-tertiary-fixed opacity-30 rounded-tr-full -ml-12 -mb-12 pointer-events-none"></div>
<!-- Icon -->
<div class="w-24 h-24 rounded-full bg-primary-fixed flex items-center justify-center mb-lg relative z-10 shadow-sm animate-pulse-slow">
<span class="material-symbols-outlined text-primary text-[48px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">hourglass_empty</span>
</div>
<!-- Text Content -->
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm relative z-10">Your application is under review</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-base relative z-10">
                We're verifying your documents. Usually within 24 hours.
            </p>
<p class="font-body-md text-body-md text-secondary mb-xl relative z-10">
                We'll notify you when it's ready
            </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-md relative z-10">
<button class="w-full h-[56px] rounded-full bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center hover:bg-primary transition-colors active:scale-95 shadow-sm">
                    Track status
                </button>
<button class="w-full h-[56px] rounded-full bg-transparent text-primary-container font-label-md text-label-md flex items-center justify-center hover:bg-surface-container-low transition-colors active:scale-95">
                    Back to Home
                </button>
</div>
</div>
</main>
<style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .9; transform: scale(0.98); }
        }
        .animate-pulse-slow {
            animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</body></html>
