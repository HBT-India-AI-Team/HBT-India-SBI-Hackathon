<style>
        /* Hide scrollbar for immersive feel */
        ::-webkit-scrollbar { display: none; }
        html { -ms-overflow-style: none; scrollbar-width: none; }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-surface text-on-surface font-body-md h-screen w-full relative overflow-hidden flex flex-col antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Main Game Canvas (Full Bleed Image) -->
<main class="absolute inset-0 w-full h-full z-0 bg-secondary-fixed">
<img class="w-full h-full object-cover object-center" data-alt="A vibrant, immersive 3D-style mobile game scene viewed from a third-person perspective. A cute, energetic, highly detailed character is running forward through a stylized, bright, abstract landscape filled with geometric shapes and floating, glowing gold coins. The lighting is sunny, soft, and optimistic, perfectly fitting a modern, light-mode, high-end mobile UI aesthetic. High-quality 3D illustration style, colorful and engaging, with soft ambient shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXN29oQCtJQ5XwNS4h2m_ZLd6sH-VxUNKDeVbYf8HYZ07VXNP_H7o5LxoMgv98bAMwfZpW0g-GFCRuK-s83ZCYMu8MA-VmkKXTlcl3DhvUtPiOU0s83V6YEU0FKPyXQWLS2uA0r9x4jkB9JWi3qHWqAtNjaFh8veMK5CbWA0kHdieBD0d85nJoCjw-z8J8xCF_V2a0m4bNB7NLr_K4ZgadlH2A6F-pajTcc2y7Be9l_szNJ4jA6avNeQ"/>
<!-- Subtle gradient overlay to ensure UI legibility at top and bottom -->
<div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/30 pointer-events-none"></div>
</main>
<!-- Top Chrome (Floating Navigation & Score) -->
<header class="absolute top-0 w-full z-20 flex justify-between items-center px-container-margin py-md pt-12">
<!-- Back Arrow -->
<button class="w-12 h-12 rounded-full bg-surface/80 backdrop-blur-md flex items-center justify-center text-primary shadow-[0px_4px_20px_rgba(26,79,138,0.1)] active:scale-95 transition-transform border border-outline-variant/20 hover:bg-surface-container-low">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Coin/Score Readout -->
<div class="h-12 bg-surface/90 backdrop-blur-md rounded-full px-5 flex items-center gap-xs shadow-[0px_4px_20px_rgba(26,79,138,0.1)] border border-outline-variant/30 text-primary font-headline-sm active:scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined icon-fill text-[#F5A623]">monetization_on</span>
<span>540</span>
</div>
</header>
<!-- In-Game Floating UI Actions (Optional, for immersion) -->
<div class="absolute bottom-28 left-container-margin z-10">
<button class="w-14 h-14 rounded-full bg-surface/50 backdrop-blur-md flex items-center justify-center text-primary shadow-lg border border-white/40 active:scale-90 transition-transform">
<span class="material-symbols-outlined text-[28px]">pause</span>
</button>
</div>
<div class="absolute bottom-28 right-container-margin z-10">
<button class="w-20 h-20 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0px_8px_30px_rgba(0,56,107,0.4)] border-4 border-surface/30 active:scale-90 transition-transform">
<span class="material-symbols-outlined icon-fill text-[40px]">bolt</span>
</button>
</div>
<!-- BottomNavBar (Shared Component from JSON) -->
<nav class="fixed bottom-0 w-full z-50 backdrop-blur-md rounded-t-xl bg-surface/80 dark:bg-inverse-surface/80 border-t-0 shadow-[0px_-4px_20px_rgba(26,79,138,0.05)] flex justify-around items-center px-xs py-sm pb-6 md:hidden">
<!-- Home (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/50 active:scale-90 transition-all duration-200 px-4 py-1 rounded-full group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors text-[24px]">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Game (ACTIVE) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-2 hover:bg-secondary-container/50 active:scale-90 transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined icon-fill text-[24px]">sports_esports</span>
<span class="font-label-sm text-label-sm mt-1">Game</span>
</button>
<!-- Chat (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/50 active:scale-90 transition-all duration-200 px-4 py-1 rounded-full group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors text-[24px]">chat_bubble</span>
<span class="font-label-sm text-label-sm mt-1">Chat</span>
</button>
<!-- Accounts (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/50 active:scale-90 transition-all duration-200 px-4 py-1 rounded-full group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors text-[24px]">account_balance_wallet</span>
<span class="font-label-sm text-label-sm mt-1">Accounts</span>
</button>
<!-- Profile (Inactive) -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/50 active:scale-90 transition-all duration-200 px-4 py-1 rounded-full group">
<span class="material-symbols-outlined group-hover:text-primary transition-colors text-[24px]">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
