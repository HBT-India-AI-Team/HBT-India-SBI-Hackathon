<style>
        body { font-family: 'Quicksand', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen flex flex-col overflow-hidden">
<!-- TopAppBar (Transactional - Hidden Nav Shells) -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim z-50">
<div class="flex items-center justify-between px-container-margin h-14 w-full">
<button class="active:scale-95 transition-transform p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm-mobile text-primary dark:text-primary-fixed-dim font-bold">Open Account</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Progress Stepper -->
<div class="px-container-margin py-xs bg-surface border-b border-surface-variant flex justify-between items-center sticky top-14 z-40">
<div class="flex flex-col items-center">
<div class="w-8 h-8 rounded-full border-2 border-primary-container flex items-center justify-center bg-primary-container/10">
<span class="font-label-sm text-label-sm text-primary-container">1</span>
</div>
<span class="font-label-sm text-label-sm text-primary-container mt-1">Consent</span>
</div>
<div class="flex-1 h-[2px] bg-surface-variant mx-2"></div>
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center bg-surface">
<span class="font-label-sm text-label-sm text-outline-variant">2</span>
</div>
</div>
<div class="flex-1 h-[2px] bg-surface-variant mx-2"></div>
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center bg-surface">
<span class="font-label-sm text-label-sm text-outline-variant">3</span>
</div>
</div>
<div class="flex-1 h-[2px] bg-surface-variant mx-2"></div>
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center bg-surface">
<span class="font-label-sm text-label-sm text-outline-variant">4</span>
</div>
</div>
<div class="flex-1 h-[2px] bg-surface-variant mx-2"></div>
<div class="flex flex-col items-center">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center bg-surface">
<span class="font-label-sm text-label-sm text-outline-variant">5</span>
</div>
</div>
</div>
<!-- Chat Interface Main Area -->
<main class="flex-1 overflow-y-auto px-container-margin py-lg flex flex-col justify-end space-y-md">
<!-- Bot Message -->
<div class="flex items-end gap-sm max-w-[85%] animate-fade-in-up">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary flex items-center justify-center shrink-0 shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="smart_toy">smart_toy</span>
</div>
<div class="bg-surface-container-highest rounded-2xl rounded-bl-sm p-md shadow-[0px_4px_20px_rgba(26,79,138,0.05)] text-on-surface">
<p class="font-body-md text-body-md">
                    Hey Gopi! Saw you finished the Savings Quest 🎮 — ready to turn those coins into a real SBI account? Takes about 2 minutes.
                </p>
</div>
</div>
<!-- Quick Replies -->
<div class="flex flex-wrap gap-sm justify-end w-full animate-fade-in-up" style="animation-delay: 0.3s;">
<button class="px-md py-sm rounded-full bg-surface border-2 border-primary-container text-primary-container font-label-md text-label-md hover:bg-primary-container/10 active:scale-95 transition-all shadow-sm">
                Tell me more first
            </button>
<button class="px-md py-sm rounded-full bg-primary-container text-on-primary font-label-md text-label-md hover:bg-primary active:scale-95 transition-all shadow-md">
                Let's go
            </button>
</div>
</main>
<!-- Bottom Input Bar -->
<div class="p-container-margin bg-surface border-t border-surface-variant sticky bottom-0 z-40">
<div class="flex items-center gap-sm bg-surface-container-low rounded-full px-md py-sm border border-outline-variant focus-within:border-primary-container transition-colors shadow-[0px_4px_20px_rgba(26,79,138,0.02)]">
<button class="text-on-surface-variant hover:text-primary-container transition-colors p-1">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-outline p-0" placeholder="Type a message..." type="text"/>
<button class="w-10 h-10 rounded-full bg-primary-container text-on-primary flex items-center justify-center hover:bg-primary active:scale-95 transition-all shadow-sm">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
</div>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.4s ease-out forwards;
        }
    </style>
