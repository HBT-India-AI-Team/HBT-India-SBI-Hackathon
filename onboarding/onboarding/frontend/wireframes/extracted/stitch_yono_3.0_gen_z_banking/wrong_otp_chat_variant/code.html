<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SBI YONO 3.0 - Chat Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#a5c8ff",
                        "primary-fixed-dim": "#a5c8ff",
                        "error": "#ba1a1a",
                        "on-secondary-container": "#626567",
                        "on-tertiary-fixed-variant": "#6e3900",
                        "surface-container": "#ededf3",
                        "on-primary-fixed-variant": "#0d4782",
                        "surface-dim": "#d9dadf",
                        "surface-container-high": "#e8e8ed",
                        "on-tertiary-container": "#ffae6b",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff",
                        "primary": "#00386b",
                        "surface": "#f9f9ff",
                        "tertiary-fixed": "#ffdcc3",
                        "background": "#f9f9ff",
                        "inverse-on-surface": "#f0f0f6",
                        "outline-variant": "#c2c6d1",
                        "surface-tint": "#2f5f9b",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed": "#191c1e",
                        "secondary-fixed-dim": "#c4c7ca",
                        "on-error-container": "#93000a",
                        "on-surface": "#1a1c20",
                        "secondary-fixed": "#e0e3e6",
                        "tertiary": "#582c00",
                        "surface-container-low": "#f3f3f9",
                        "surface-bright": "#f9f9ff",
                        "secondary": "#5b5f61",
                        "primary-fixed": "#d4e3ff",
                        "surface-variant": "#e2e2e8",
                        "error-container": "#ffdad6",
                        "secondary-container": "#e0e3e6",
                        "outline": "#737781",
                        "on-secondary-fixed-variant": "#44474a",
                        "surface-container-highest": "#e2e2e8",
                        "on-tertiary-fixed": "#2f1500",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#001c3a",
                        "tertiary-container": "#793f00",
                        "tertiary-fixed-dim": "#ffb77e",
                        "primary-container": "#1a4f8a",
                        "on-surface-variant": "#424750",
                        "inverse-surface": "#2e3035",
                        "on-background": "#1a1c20",
                        "on-primary-container": "#9ac2ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "md": "16px",
                        "xs": "8px",
                        "sm": "12px",
                        "container-margin": "20px",
                        "base": "4px",
                        "xl": "32px",
                        "card-gap": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Quicksand"],
                        "headline-sm": ["Quicksand"],
                        "display-lg": ["Quicksand"],
                        "label-md": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "label-sm": ["Quicksand"],
                        "headline-lg-mobile": ["Quicksand"],
                        "body-md": ["Quicksand"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f9f9ff;
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-container-margin h-14 w-full bg-surface w-full top-0 sticky z-50">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary font-bold">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<h1 class="font-headline-sm text-headline-sm text-primary">YONO Assistant</h1>
</div>
<!-- Spacer for centering -->
<div class="w-10"></div>
</header>
<!-- Progress Stepper -->
<div class="px-container-margin py-md bg-surface z-40">
<div class="flex items-center justify-between relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-surface-variant rounded-full z-0"></div>
<!-- Step 1 -->
<div class="relative z-10 flex flex-col items-center gap-base">
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[14px]">check</span>
</div>
<span class="font-label-sm text-label-sm text-primary">Details</span>
</div>
<!-- Step 2 (Active) -->
<div class="relative z-10 flex flex-col items-center gap-base">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-sm text-label-sm shadow-[0px_4px_10px_rgba(26,79,138,0.2)] border-2 border-surface">
                    2
                </div>
<span class="font-label-md text-label-md text-primary">Verify Mobile</span>
</div>
<!-- Step 3 -->
<div class="relative z-10 flex flex-col items-center gap-base">
<div class="w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-sm text-label-sm border-2 border-surface">
                    3
                </div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Setup</span>
</div>
</div>
</div>
<!-- Chat Area (Canvas) -->
<main class="flex-1 overflow-y-auto px-container-margin py-lg flex flex-col gap-lg">
<!-- Assistant Message -->
<div class="flex flex-col items-start max-w-[85%] self-start gap-base">
<div class="bg-surface-container-lowest p-md rounded-[16px] rounded-tl-none shadow-[0px_4px_20px_rgba(26,79,138,0.05)] border border-surface-variant/50">
<p class="font-body-md text-body-md text-on-surface">Please enter the 6-digit code sent to your registered mobile number ending in **89.</p>
</div>
</div>
<!-- User Message -->
<div class="flex flex-col items-end max-w-[85%] self-end gap-base">
<div class="bg-primary-container text-on-primary-container p-md rounded-[16px] rounded-tr-none shadow-[0px_4px_20px_rgba(26,79,138,0.1)]">
<p class="font-body-md text-body-md">123456</p>
</div>
</div>
<!-- Error/Warning Message from Bot -->
<div class="flex flex-col items-start max-w-[85%] self-start gap-base mt-2">
<div class="bg-error-container text-on-error-container p-md rounded-[16px] rounded-tl-none shadow-[0px_4px_20px_rgba(186,26,26,0.1)] border border-error/20 flex gap-sm items-start">
<span class="material-symbols-outlined text-error mt-0.5">error</span>
<div class="flex flex-col gap-sm">
<p class="font-body-md text-body-md font-medium">That code didn't match. Try again?</p>
</div>
</div>
<!-- Action Link below bubble -->
<button class="ml-sm mt-xs font-label-md text-label-md text-primary-container hover:text-primary transition-colors underline underline-offset-4 decoration-primary-container/30 hover:decoration-primary">
                Resend code
            </button>
</div>
</main>
<!-- Bottom Input Area (Suppressing BottomNavBar per instructions since this is a transactional flow) -->
<div class="bg-surface p-container-margin pb-safe border-t border-outline-variant/30 flex items-center gap-sm">
<div class="flex-1 bg-surface-container-low rounded-[16px] flex items-center px-sm border border-transparent focus-within:border-primary transition-colors h-14">
<input class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/70" placeholder="Type your message..." type="text"/>
</div>
<button aria-label="Send message" class="w-14 h-14 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center hover:bg-primary transition-colors active:scale-95 shadow-md flex-shrink-0">
<span class="material-symbols-outlined text-on-primary-container">send</span>
</button>
</div>
</body></html>
