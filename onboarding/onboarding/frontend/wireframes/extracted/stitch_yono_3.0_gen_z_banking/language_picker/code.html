<body class="bg-surface text-on-surface h-screen w-full overflow-hidden flex flex-col font-body-md antialiased relative">

</div>
</div>
<!-- Bottom Sheet Overlay Overlay -->

<h2 class="font-headline-sm text-headline-sm text-on-surface">Choose your language</h2>

<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>

<div class="flex-1 overflow-y-auto px-container-margin py-md space-y-sm">
<!-- Option: English (Selected) -->

                    </div>
<div>
<span class="block font-body-md text-body-md text-on-surface">English</span>
<span class="block font-label-md text-label-md text-on-surface-variant">English</span>
</div>
</div>
<div class="relative flex items-center justify-center">
<input checked="" class="peer sr-only" name="language" type="radio" value="en"/>
<div class="w-6 h-6 rounded-full border-2 border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>

<div class="w-10 h-10 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center font-headline-sm text-headline-sm">
                        अ
                    </div>
<div>
<span class="block font-body-md text-body-md text-on-surface">हिन्दी</span>

</div>
</div>

<input class="peer sr-only" name="language" type="radio" value="hi"/>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>

<div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-on-primary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>

<!-- Pinned Bottom Action -->

<button class="w-full h-[56px] bg-primary text-on-primary rounded-full font-label-md text-label-md active:scale-95 transition-transform flex items-center justify-center">
                Done
            </button>

<script>
        // Minimal interaction logic for radio selection styling updates
        const radios = document.querySelectorAll('input[name="language"]');
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all to unselected state
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('border-primary', 'bg-primary-fixed/20');
                    label.classList.add('border-outline-variant');
                });
                
                // Set selected state on parent label
                if(e.target.checked) {
                    const parentLabel = e.target.closest('label');
                    parentLabel.classList.remove('border-outline-variant');
                    parentLabel.classList.add('border-primary', 'bg-primary-fixed/20');
                }
            });
        });
    </script>
</body></html>
