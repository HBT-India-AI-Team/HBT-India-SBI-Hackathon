        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<body class="bg-surface text-on-surface h-screen flex flex-col overflow-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 sticky shadow-sm bg-surface dark:bg-inverse-surface shadow-[0px_4px_20px_rgba(26,79,138,0.05)] z-40">
<div class="flex items-center justify-between px-container-margin py-md">
<div class="flex items-center gap-sm cursor-pointer hover:bg-surface-container-low p-2 -ml-2 rounded-full transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">YONO 3.0</span>
</div>
<div class="flex items-center gap-xs">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center overflow-hidden hover:bg-surface-container-high transition-colors cursor-pointer">
<img class="w-full h-full object-cover" data-alt="A small, stylized profile avatar of a smiling young adult with modern glasses, set against a soft, bright white background. The style is modern, approachable, and illustrative, fitting a Gen-Z financial app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDLu8Ku4DwbKF0ClqU5v0ULfdkBXP8ayjUV3pv7psd9rl1Karllnj2mNiXuY7iSGS2MlpE9HI1EEGOHl_7RU7gjbL78h6d5sgg56eqr2MmAxWxVUT_uUekN-833hADQXAIDHRt4n5fIDnX6Xkudr7yCWfY8C-ESNcEB3PCT63nFZI7nMFtMKx40yaC8gj2h2QfzNImWtaCDtsfqIGnTnMhjvSD8oDENHlIHm5gX5f4UzpLHOjhzwVgKqg"/>

<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</div>
</header>
<!-- Chat Canvas -->
<main class="flex-1 overflow-y-auto no-scrollbar pb-24 relative flex flex-col px-container-margin py-lg gap-lg">
<!-- Date Divider -->
<div class="flex justify-center my-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container-low px-sm py-1 rounded-full">Today, 10:42 AM</span>
</div>
<!-- User Message -->
<div class="flex justify-end mb-sm">
<div class="max-w-[85%] bg-primary-container text-on-primary-container rounded-bubble rounded-tr-sm px-md py-sm shadow-sm">
<p class="font-body-md text-body-md">What's the latest update on the upcoming tech merger?</p>
</div>
</div>
<!-- FinGuru Message Wrapper -->
<div class="flex gap-sm items-end mb-xs">
<!-- Avatar -->
<div class="w-10 h-10 rounded-full bg-surface-container-high flex-shrink-0 flex items-center justify-center shadow-sm overflow-hidden border-2 border-white">
<img class="w-full h-full object-cover" data-alt="A flat, modern, minimalist illustration of a wise owl mascot head in a deep blue and gold color palette. The owl looks friendly and knowledgeable. Bright, light mode aesthetic suitable for a modern banking app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBX65XsryxPtbCkq2qHLMwGZIsFwV9-DiawMDUwj-uO83IBtaTWSFLDCYs9eQYJxOE4uuSl-h7abEgcKBptY0paCkODKbuSD93eR3VmdvdyLilFWrdeFLIA88nlQsQR6pk9Wd33Tbcu0jEFBKZdHbSNpmRC1jucwUI3-AsY_C9Jrg9SJSaSuvfcvSDNecx5k7bo8kRs4r2YtooZy-khVBqnjnYjMsn-TM98kna-hxy3dDcFoUgEoyxPeg"/>

<div class="flex items-center gap-xs mb-1">
<span class="font-label-sm text-label-sm text-finguru-gold-dark uppercase tracking-wider">FinGuru</span>
</div>
<p class="font-body-md text-body-md text-on-surface">
                    I don't have solid info on this yet — want me to look into it and get back to you?
                </p>
</div>
</div>
<!-- Quick Replies -->
<div class="flex flex-col gap-xs ml-[52px]">
<button class="bg-[#d4af37] text-white font-label-md text-label-md rounded-full px-lg py-sm self-start shadow-sm active:scale-95 transition-transform hover:bg-[#b5952f]">
                Yes, research this
            </button>
<button class="bg-transparent border-1.5 border-[#d4af37] text-[#d4af37] font-label-md text-label-md rounded-full px-lg py-sm self-start active:scale-95 transition-transform hover:bg-finguru-gold-tint">
                No thanks
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 backdrop-blur-md rounded-t-xl border-t border-outline-variant/30 shadow-[0px_-4px_20px_rgba(26,79,138,0.05)] bg-surface/80 dark:bg-inverse-surface/80 md:hidden">
<div class="flex justify-around items-center px-xs py-sm">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/50 active:scale-90 transition-all duration-200 p-2 rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<!-- Game -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/50 active:scale-90 transition-all duration-200 p-2 rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="sports_esports">sports_esports</span>
<span class="font-label-sm text-label-sm">Game</span>
</button>
<!-- Chat (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 active:scale-90 transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined mb-1 filled" data-icon="chat_bubble">chat_bubble</span>
<span class="font-label-sm text-label-sm">Chat</span>
</button>
<!-- Accounts -->
<button class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/50 active:scale-90 transition-all duration-200 p-2 rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-label-sm text-label-sm">Accounts</span>
</button>

<button class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/50 active:scale-90 transition-all duration-200 p-2 rounded-lg">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</div>

<div class="fixed bottom-[72px] md:bottom-0 w-full bg-surface px-container-margin py-sm border-t border-surface-variant z-30">
<div class="flex items-center bg-surface-container-low rounded-full px-4 py-2 border border-surface-variant focus-within:border-primary transition-colors">
<button class="text-secondary hover:text-primary transition-colors mr-2">
<span class="material-symbols-outlined">add_circle</span>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 p-0" placeholder="Type a message..." type="text"/>

<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</div>
