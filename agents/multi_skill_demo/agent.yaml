agent_id: multi_skill_demo
version: "1.0.0"
purpose: >
  Demonstrates a single agent drawing on multiple skills at once: rule-
  bearing skills (risk-focused vs growth-focused review) and guidance-only
  skills (how to explain things to a first-time vs. repeat applicant) are
  all just "skills" now — any subset relevant to the request can load
  together, not just one deterministic rule-set plus optional narration
  flavor.

skills:
  - advisor_risk
  - advisor_growth
  - explain_to_first_time_applicant
  - explain_to_repeat_customer

pipeline:
  - load_input
  - gather_evidence
  - load_skills
  - evaluate_rules
  - reason_llm
  - validate_output
  - decide
  - hitl_gate
  - explain

capabilities: []

governance:
  hitl_conditions:
    - low_confidence
    - validation_degraded
  confidence_threshold: 0.5
  max_llm_retries: 1

llm:
  model: gemma4:12b
  temperature: 0.0
  seed: 7
  timeout_seconds: 120

input_schema:
  type: object
  required: []
  properties:
    request:
      type: string
      description: >
        Free-text description of what's being asked (e.g. "assess this
        first-time applicant's debt risk"). Drives which of the four
        skills load_skills loads for this request — any subset, not just
        one.
    evidence:
      type: object
      description: >
        Arbitrary evidence dict evaluated against whichever loaded skills
        have rules — e.g. {"debt_ratio": 0.4, "credit_score": 720,
        "growth_rate": 18}.
    skill_ids:
      type: array
      description: >
        Optional explicit override — skip the AI skill-loading call and
        force loading exactly these skill ids directly.

output_schema:
  type: object
  required: [outcome, reason, composite_score]
  properties:
    outcome:
      type: string
      enum: [QUALIFIED, CONDITIONALLY_QUALIFIED, NEEDS_HUMAN_REVIEW, NOT_QUALIFIED]
    reason:
      type: string
    composite_score:
      type: number
