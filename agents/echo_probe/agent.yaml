agent_id: echo_probe
version: "1.0.0"
purpose: >
  Reusability proof, not a real product agent. Runs a short 2-stage
  pipeline (load_input, explain) with a different skill package and no
  capabilities or LLM calls, through the exact same AgentLoader and
  pipeline executor as lead_qualification, to demonstrate that adding an
  agent is a configuration change, not a runtime code change.

skills:
  - echo_probe

routable: false

pipeline:
  - load_input
  - explain

capabilities: []

governance:
  hitl_conditions: []

llm:
  model: granite4.1:3b

input_schema:
  type: object
  required: [message]
  properties:
    message:
      type: string
