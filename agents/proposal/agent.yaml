agent_id: proposal
version: "1.0.0"
purpose: >
  Generate a concise, evidence-based product recommendation and
  customer-facing proposal from an already-qualified lead's result.
  Never overrides the qualification decision — only proceeds with the
  products qualification already deemed eligible.

skills:
  - proposal

pipeline:
  - load_input
  - select_products
  - reason_llm
  - validate_output
  - finalize_proposal
  - explain

capabilities: []

governance:
  hitl_conditions: []
  confidence_threshold: 0.5
  max_llm_retries: 1

llm:
  model: gemma4:12b
  temperature: 0.0
  seed: 7
  timeout_seconds: 120

# Nested objects/arrays (lead, qualification_result, eligible_products) —
# not flat fields a form can render, not evidence chat can extract into.
input_mode: json

input_schema:
  type: object
  required: [lead, qualification_result, eligible_products]
  properties:
    lead: {type: object}
    qualification_result: {type: object}
    eligible_products: {type: array}

output_schema:
  type: object
  required: [proposal_status, recommended_products]
  properties:
    proposal_status: {type: string, enum: [READY, NO_PRODUCT_MATCH]}
    recommended_products: {type: array}
