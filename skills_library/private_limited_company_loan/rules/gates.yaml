rule_group: gates
description: "Generated by Agent Builder from a plain-language description \u2014\
  \ review before trusting."
gates:
- id: high_turnover
  description: Annual turnover must exceed 1 crore
  field: annual_turnover
  operator: gt
  value: 10000000
  on_fail:
    decision: NOT_QUALIFIED
    reason: Insufficient annual turnover
- id: sufficient_audits
  description: Must have at least 2 years of audited financials
  field: audited_years_count
  operator: gte
  value: 2
  on_fail:
    decision: NOT_QUALIFIED
    reason: Insufficient audit history
- id: no_regulatory_issues
  description: Must have zero regulatory notices
  field: regulatory_notices_count
  operator: eq
  value: 0
  on_fail:
    decision: NOT_QUALIFIED
    reason: Regulatory issues detected
