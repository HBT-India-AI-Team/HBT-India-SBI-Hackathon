skill_id: gst_lead_qualification
version: "1.0.0"
kind: deterministic
description: >
  Evaluate GST-registered business lead eligibility by checking if monthly turnover is above 5 lakh, filing compliance is over 90 percent, and no filings have lapsed for more than 2 consecutive months; then recommend a product (working capital loan, GeM vendor financing, or business current account) based on channel and turnover, requiring human review before contact.

instructions: instructions.md
output_contract: output_contract.json

shared_includes:
  - shared/compliance_guardrails.md

rules:
  gates: rules/gates.yaml
  factors: rules/factors.yaml
  composite: rules/composite.yaml
  product_fit: rules/product_fit.yaml
