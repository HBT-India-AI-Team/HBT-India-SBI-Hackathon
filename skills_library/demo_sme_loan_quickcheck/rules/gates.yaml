rule_group: gates
description: "Generated by Agent Builder from a plain-language description \u2014\
  \ review before trusting."
gates:
- id: min_turnover
  description: Annual turnover exceeds 40 lakh
  field: annual_turnover
  operator: gt
  value: 4000000
  on_fail:
    decision: NOT_QUALIFIED
    reason: Annual turnover is below 40 lakh
- id: min_tenure
  description: Business active for more than 1 year
  field: years_in_business
  operator: gt
  value: 1
  on_fail:
    decision: NOT_QUALIFIED
    reason: Business has been operating for 1 year or less
- id: no_defaults
  description: No active loan defaults
  field: active_loan_defaults
  operator: eq
  value: 0
  on_fail:
    decision: NOT_QUALIFIED
    reason: Active loan default(s) on record
